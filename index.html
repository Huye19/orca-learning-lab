<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学习任务看板</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>学习任务看板</h1>
    <p class="intro">记录每一步学习进度。</p>
    <form id="task-form">
      <label for="task-input">新任务</label>
      <div class="entry">
        <input id="task-input" placeholder="例如：阅读一章教材" autocomplete="off" required>
        <label for="task-priority">优先级</label>
        <select id="task-priority">
          <option value="高">高</option>
          <option value="中" selected>中</option>
          <option value="低">低</option>
        </select>
        <button type="submit">添加任务</button>
      </div>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
    <section aria-labelledby="stats-title">
      <h2 id="stats-title">任务统计</h2>
      <dl id="stats" aria-live="polite">
        <div><dt>全部任务</dt><dd id="stat-total">0</dd></div>
        <div><dt>待完成</dt><dd id="stat-pending">0</dd></div>
        <div><dt>已完成</dt><dd id="stat-done">0</dd></div>
      </dl>
    </section>
    <section aria-labelledby="list-title">
      <h2 id="list-title">我的任务</h2>
      <label for="task-filter">筛选任务</label>
      <select id="task-filter">
        <option value="all">全部</option>
        <option value="pending">待完成</option>
        <option value="done">已完成</option>
      </select>
      <label for="task-sort">排序方式</label>
      <select id="task-sort">
        <option value="default">原始顺序</option>
        <option value="priority">优先级从高到低</option>
      </select>
      <p id="empty">还没有任务，添加一个开始学习吧。</p>
      <ul id="tasks"></ul>
    </section>
  </main>
</body>
</html>
